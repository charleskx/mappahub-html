<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>MappaHub — Gerar Assets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; margin: 0; }
    h1  { font-size: 1.5rem; font-weight: 800; margin: 0; }
    p   { color: #94a3b8; margin: 0; font-size: .9rem; }
    #status { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px 32px; text-align: center; max-width: 440px; display: flex; flex-direction: column; gap: 8px; }
    .file { display: flex; align-items: center; gap: 10px; font-size: .875rem; padding: 6px 0; }
    .file svg { flex-shrink: 0; }
    .ok   { color: #10b981; }
    .wait { color: #64748b; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div id="status">
    <h1>Gerando assets…</h1>
    <p>Os arquivos serão baixados automaticamente.</p>
    <div id="log"></div>
  </div>

  <canvas id="c-og"    width="1200" height="630"></canvas>
  <canvas id="c-icon"  width="180"  height="180"></canvas>
  <canvas id="c-ico32" width="32"   height="32"></canvas>
  <canvas id="c-ico16" width="16"   height="16"></canvas>

  <script>
  /* ── Helpers ─────────────────────────────────────────────────────────── */
  function log(filename) {
    const div = document.getElementById('log');
    const el = document.createElement('div');
    el.className = 'file ok';
    el.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ${filename} baixado`;
    div.appendChild(el);
  }

  function download(canvas, filename, type = 'image/png') {
    const a = document.createElement('a');
    a.href = canvas.toDataURL(type);
    a.download = filename;
    a.click();
  }

  function downloadBlob(bytes, filename, mime) {
    const blob = new Blob([bytes], { type: mime });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  /* ── Draw map-pin icon (reused on all canvases) ───────────────────────
     cx, cy = center of the rounded-square icon box
     boxSize = size of the blue rounded square
  */
  function drawIcon(ctx, cx, cy, boxSize) {
    const r = boxSize * 0.24;
    ctx.save();

    // Blue rounded square
    ctx.beginPath();
    ctx.moveTo(cx - boxSize/2 + r, cy - boxSize/2);
    ctx.lineTo(cx + boxSize/2 - r, cy - boxSize/2);
    ctx.quadraticCurveTo(cx + boxSize/2, cy - boxSize/2, cx + boxSize/2, cy - boxSize/2 + r);
    ctx.lineTo(cx + boxSize/2, cy + boxSize/2 - r);
    ctx.quadraticCurveTo(cx + boxSize/2, cy + boxSize/2, cx + boxSize/2 - r, cy + boxSize/2);
    ctx.lineTo(cx - boxSize/2 + r, cy + boxSize/2);
    ctx.quadraticCurveTo(cx - boxSize/2, cy + boxSize/2, cx - boxSize/2, cy + boxSize/2 - r);
    ctx.lineTo(cx - boxSize/2, cy - boxSize/2 + r);
    ctx.quadraticCurveTo(cx - boxSize/2, cy - boxSize/2, cx - boxSize/2 + r, cy - boxSize/2);
    ctx.closePath();
    ctx.fillStyle = '#2563EB';
    ctx.fill();

    // White map pin path (teardrop + circle hole)
    const ps = boxSize * 0.28; // pin scale factor
    const px = cx;
    const py = cy - ps * 0.05;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    // Outer teardrop
    ctx.arc(px, py - ps * 0.10, ps * 0.52, Math.PI, 0, false);
    ctx.bezierCurveTo(px + ps * 0.52, py + ps * 0.55, px, py + ps * 0.9, px, py + ps * 0.9);
    ctx.bezierCurveTo(px, py + ps * 0.9, px - ps * 0.52, py + ps * 0.55, px - ps * 0.52, py - ps * 0.10);
    ctx.closePath();
    ctx.fill();

    // Inner circle cutout
    ctx.fillStyle = '#2563EB';
    ctx.beginPath();
    ctx.arc(px, py - ps * 0.10, ps * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  /* ── OG Image 1200×630 ────────────────────────────────────────────────── */
  function drawOG() {
    const canvas = document.getElementById('c-og');
    const ctx = canvas.getContext('2d');
    const W = 1200, H = 630;

    // Background gradient (dark-blue → blue, matching CTA section)
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#1e3a8a');
    bg.addColorStop(1, '#2563EB');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Decorative circles (glow effect)
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(W - 160, -80, 300, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(60, H + 40, 240, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Decorative pin dots (right side)
    const pins = [
      { x: W - 300, y: 140, r: 14, c: '#60a5fa' },
      { x: W - 180, y: 240, r: 18, c: '#f59e0b' },
      { x: W - 380, y: 310, r: 12, c: '#34d399' },
      { x: W - 120, y: 380, r: 16, c: '#f87171' },
      { x: W - 280, y: 460, r: 10, c: '#a78bfa' },
      { x: W - 450, y: 210, r: 10, c: '#34d399' },
      { x: W - 500, y: 400, r: 8,  c: '#60a5fa' },
      { x: W - 160, y: 160, r: 8,  c: '#f59e0b' },
    ];
    pins.forEach(({ x, y, r, c }) => {
      // Pin body (teardrop)
      ctx.save();
      ctx.fillStyle = c;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(x, y, r, Math.PI, 0, false);
      ctx.bezierCurveTo(x + r, y + r * 1.8, x, y + r * 2.4, x, y + r * 2.4);
      ctx.bezierCurveTo(x, y + r * 2.4, x - r, y + r * 1.8, x - r, y);
      ctx.closePath();
      ctx.fill();
      // Inner dot
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Connection lines between pins (map feel)
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    const pts = pins.slice(0, 5).map(p => ({ x: p.x, y: p.y + p.r * 2.4 }));
    for (let i = 0; i < pts.length - 1; i++) {
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
      ctx.stroke();
    }
    ctx.restore();

    // Logo icon
    drawIcon(ctx, 96, 96, 72);

    // Brand name
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 52px Inter, sans-serif';
    ctx.fillText('MappaHub', 80, 218);

    // Tagline
    ctx.fillStyle = 'rgba(255,255,255,0.80)';
    ctx.font = '400 28px Inter, sans-serif';
    ctx.fillText('Visualize sua rede de parceiros no mapa', 80, 276);

    // Divider line
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(80, 310, 520, 1.5);

    // Feature pills
    const features = ['Geocoding automático', 'Importação via Excel', 'Mapas públicos', 'Trial 14 dias grátis'];
    let fx = 80;
    const fy = 360;
    features.forEach(text => {
      ctx.font = '600 18px Inter, sans-serif';
      const tw = ctx.measureText(text).width;
      const pw = tw + 32, ph = 40, pr = 8;

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.roundRect(fx, fy, pw, ph, pr);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(text, fx + 16, fy + 26);

      fx += pw + 12;
      if (fx > 620) { fx = 80; }
    });

    // URL badge at bottom
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.roundRect(80, H - 72, 280, 40, 8);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '500 18px Inter, sans-serif';
    ctx.fillText('mappahub.com.br', 104, H - 45);
  }

  /* ── Apple Touch Icon 180×180 ─────────────────────────────────────────── */
  function drawAppleIcon() {
    const canvas = document.getElementById('c-icon');
    const ctx = canvas.getContext('2d');
    const S = 180;

    // Full blue background (iOS clips to circle automatically, but fill square)
    const bg = ctx.createLinearGradient(0, 0, S, S);
    bg.addColorStop(0, '#1d4ed8');
    bg.addColorStop(1, '#2563EB');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, S, S);

    // Map pin centered
    drawIcon(ctx, S / 2, S / 2, S * 0.72);
  }

  /* ── Favicon 32×32 & 16×16 ────────────────────────────────────────────── */
  function drawFavicon(canvasId, size) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const S = size;

    const bg = ctx.createLinearGradient(0, 0, S, S);
    bg.addColorStop(0, '#1d4ed8');
    bg.addColorStop(1, '#2563EB');
    ctx.fillStyle = bg;
    // Rounded corners
    const r = S * 0.22;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(S - r, 0);
    ctx.quadraticCurveTo(S, 0, S, r);
    ctx.lineTo(S, S - r);
    ctx.quadraticCurveTo(S, S, S - r, S);
    ctx.lineTo(r, S);
    ctx.quadraticCurveTo(0, S, 0, S - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    drawIcon(ctx, S / 2, S / 2, S * 0.78);
  }

  /* ── Build ICO from two PNGs ──────────────────────────────────────────── */
  function buildICO(canvas32, canvas16) {
    function getPNG(canvas) {
      const b64 = canvas.toDataURL('image/png').split(',')[1];
      const raw = atob(b64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    const png32 = getPNG(canvas32);
    const png16 = getPNG(canvas16);
    const n = 2;
    const headerSize = 6;
    const entrySize  = 16;
    const offset32   = headerSize + n * entrySize;
    const offset16   = offset32 + png32.length;
    const total      = offset16 + png16.length;
    const ico        = new Uint8Array(total);

    function write16(i, v) { ico[i] = v & 0xff; ico[i+1] = (v >> 8) & 0xff; }
    function write32(i, v) { ico[i] = v & 0xff; ico[i+1] = (v >> 8) & 0xff; ico[i+2] = (v >> 16) & 0xff; ico[i+3] = (v >> 24) & 0xff; }

    // ICONDIR
    write16(0, 0); write16(2, 1); write16(4, n);

    // Entry for 32×32
    ico[6] = 32; ico[7] = 32; ico[8] = 0; ico[9] = 0;
    write16(10, 1); write16(12, 32);
    write32(14, png32.length);
    write32(18, offset32);

    // Entry for 16×16
    ico[22] = 16; ico[23] = 16; ico[24] = 0; ico[25] = 0;
    write16(26, 1); write16(28, 32);
    write32(30, png16.length);
    write32(34, offset16);

    // Image data
    ico.set(png32, offset32);
    ico.set(png16, offset16);

    return ico;
  }

  /* ── Main ─────────────────────────────────────────────────────────────── */
  window.addEventListener('load', function() {
    // Wait for Inter to load
    document.fonts.ready.then(function() {
      setTimeout(function() {
        try {
          // 1. OG Image
          drawOG();
          download(document.getElementById('c-og'), 'og-image.png');
          log('og-image.png (1200×630)');

          setTimeout(function() {
            // 2. Apple touch icon
            drawAppleIcon();
            download(document.getElementById('c-icon'), 'apple-touch-icon.png');
            log('apple-touch-icon.png (180×180)');

            setTimeout(function() {
              // 3. Favicon ICO
              drawFavicon('c-ico32', 32);
              drawFavicon('c-ico16', 16);
              const ico = buildICO(
                document.getElementById('c-ico32'),
                document.getElementById('c-ico16')
              );
              downloadBlob(ico, 'favicon.ico', 'image/x-icon');
              log('favicon.ico (32×32 + 16×16)');

              document.querySelector('h1').textContent = '✓ Assets gerados!';
              document.querySelector('p').textContent = 'Mova os 3 arquivos baixados para a pasta mappahub-html/.';
            }, 600);
          }, 600);
        } catch(e) {
          document.querySelector('p').textContent = 'Erro: ' + e.message;
          console.error(e);
        }
      }, 300);
    });
  });
  </script>
</body>
</html>
